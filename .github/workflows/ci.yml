# REzeBlog CI/CD Pipeline
# 작성일: 2026-04-18
# 기능: 테스트 → 빌드 → Vercel 배포 (Docker 없이)

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

defaults:
  run:
    working-directory: REzeBlogFront

jobs:
  # 테스트 및 검증
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: REzeBlogFront
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: rezeblog
          POSTGRES_PASSWORD: rezeblog123
          POSTGRES_DB: rezeblog_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Setup database
        env:
          DATABASE_URL: postgresql://rezeblog:rezeblog123@localhost:5432/rezeblog_test
        run: |
          npx drizzle-kit push:pg

      - name: Run tests
        env:
          DATABASE_URL: postgresql://rezeblog:rezeblog123@localhost:5432/rezeblog_test
          NODE_ENV: test
        run: npm test

      - name: Run benchmark (API response time)
        env:
          DATABASE_URL: postgresql://rezeblog:rezeblog123@localhost:5432/rezeblog_test
        run: |
          npm run dev &
          sleep 10
          npm run benchmark
        timeout-minutes: 5

  # 빌드 검증
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: REzeBlogFront
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        env:
          NODE_ENV: production
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: .next/
          retention-days: 1

  # Vercel Preview 배포 (PR)
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: REzeBlogFront
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

  # Vercel 프로덕션 배포 (main 브랜치)
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: REzeBlogFront
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # 보안 스캔
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: REzeBlogFront
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
        continue-on-error: true
