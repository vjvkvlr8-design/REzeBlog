# Docker Compose 개발 환경 오버라이드
# 작성일: 2026-04-18
# 사용법: docker-compose -f docker-compose.yml -f docker-compose.override.yml up -d

version: '3.8'

services:
  db:
    # 로컬 PostgreSQL(5432)과 충돌 방지를 위해 5433 사용
    ports:
      - "5433:5432"
    
  frontend:
    # 개발 환경: 소스 코드 변경 시 자동 재시작
    volumes:
      - ./REzeBlogFront:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    command: npm run dev
    # 핫 리로드 활성화
    stdin_open: true
    tty: true

  dashboard:
    # 대시보드 서비스 (데이터 시각화)
    build:
      context: ./REzeBlogDashboard
      dockerfile: Dockerfile.dev
    container_name: rezeblog-dashboard
    environment:
      DATABASE_URL: postgresql://rezeblog:rezeblog123@db:5432/rezeblog
      NODE_ENV: development
      NEXT_PUBLIC_SITE_URL: http://localhost:3001
    ports:
      - "3001:3001"
    volumes:
      - ./REzeBlogDashboard:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rezeblog-network
    command: npm run dev
    stdin_open: true
    tty: true
