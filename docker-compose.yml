# REzeBlog 개발 환경 Docker Compose
# 작성일: 2026-04-18
# 보안강화: 2026-04-20 - 환경변수 분리, 하드코딩 제거
# 사용법: 
#   1. .env.example을 .env로 복사: cp .env.example .env
#   2. .env 파일에 실제 비밀번호 입력
#   3. docker-compose up -d
#
# ⚠️ 절대 .env 파일을 Git에 커밋하지 마세요!

version: '3.8'

services:
  # PostgreSQL 데이터베이스
  db:
    image: postgres:15-alpine
    container_name: rezeblog-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rezeblog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_env_file}
      POSTGRES_DB: ${POSTGRES_DB:-rezeblog}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./REzeBlogDB/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./REzeBlogDB/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - rezeblog-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rezeblog"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Frontend
  frontend:
    build:
      context: ./REzeBlogFront
      dockerfile: Dockerfile.dev
    container_name: rezeblog-front
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://rezeblog:changeme_in_env_file@db:5432/rezeblog}
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    volumes:
      - ./REzeBlogFront:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rezeblog-network
    command: npm run dev

  # Redis (세션 캐시용 - 선택사항)
  redis:
    image: redis:7-alpine
    container_name: rezeblog-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rezeblog-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  rezeblog-network:
    driver: bridge
